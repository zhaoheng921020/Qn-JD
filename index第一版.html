<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>京东信息表-成都青鸟维安科技有限公司</title>
	<script src="js/vue.js"></script>
	<!-- <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css"> -->
	<link rel="stylesheet" href="css/index.css">
	<!-- 引入组件库 -->
	<script src="js/elementui.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.content {
			width: 100%;
			height: 100vh;
		}

		.content>div {
			display: flex;
			height: 100%;
			flex-direction: column;
			gap: 10px;
			background: #f1f1f1;
		}

		thead * {
			text-align: center !important;
		}

		.caption {
			flex: none;
			font-size: 24px;
			font-weight: bold;
			text-align: center;
			color: #fff;
			padding: 15px 10px 5px;
			background: linear-gradient(135deg, #0f3d75, #2563eb);
		}

		.table-container {
			flex: 1;
			height: 1px;
			text-align: center;
		}

		.search-container {
			background: #ffffff;
			flex: none;
			display: flex;
			gap: 20px;
			align-items: center;
			padding: 10px;
			border-radius: 5px;

			.block {
				display: flex;
				gap: 10px;
				align-items: center;

				.demonstration {
					width: 80px;
					text-align: right;
					font-size: 14px;
				}

				.el-date-editor .el-range-separator {
					width: 10%;
				}

			}
		}

		.pagination-main {
			width: 100%;
			flex: none;
			margin: auto;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 5px;
			background: #fff;
		}

		.el-table {
			height: 100% !important;
		}

		.el-table .cell {
			text-align: center;
		}

		.el-table .el-table__cell {
			padding: 11.05px 0;
		}

		.el-pagination {
			.el-pager li {
				padding: 0px;

				&.active {
					background: #409EFF;
					color: #ffffff;
				}
			}


		}

		.stream-status {
			/* flex: none;
			display: flex;
			align-items: center; */
			gap: 8px;
			font-size: 14px;
			color: #fff;
			padding: 5px 10px;
			border-radius: 4px;
			text-align: center;
		}

		.stream-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: #ff4d4f;
			animation: blink 1s infinite;
		}

		.stream-dot.online {
			background: #52c41a;
			animation: none;
		}

		@keyframes blink {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0.3;
			}
		}
	</style>
</head>

<body>
	<div id="app">
		<div class="content">
			<div>
				<div class="caption">京东RFID扫码实时看板
					<div class="stream-status">
						<span :class="['stream-dot', { online: streamStatus === 'connected' }]"></span>
						<span>{{ streamStatusText }}</span>
					</div>
				</div>

				<div class="search-container">
					<div class="block">
						<span class="demonstration">按日期搜索</span>
						<el-date-picker v-model="value1" type="daterange" align="right" unlink-panels range-separator="至"
							start-placeholder="开始日期" end-placeholder="结束日期" :picker-options="pickerOptions" @change="handleSearch"
							clearable size="small">
						</el-date-picker>
					</div>
					<div class="block">
						<span class="demonstration">托盘ID</span>
						<el-select v-model="listPostData.trayId" placeholder="请选择托盘ID" clearable size="small">
							<el-option v-for="(item, index) in trayIdList" :key="item.id || index" :label="item.label || item"
								:value="item.id || item"></el-option>
						</el-select>
					</div>
					<el-button type="primary" @click="searchClick" size="small">查询</el-button>
				</div>
				<div class="table-container">
					<el-table :data="tableData" height="250" border style="width: 100%">

						<el-table-column prop="id" label="ID" width="100">
						</el-table-column>
						<el-table-column prop="trayId" label="托盘ID" width="180">
						</el-table-column>
						<el-table-column prop="epc" label="EPC" width="380">
						</el-table-column>
						<el-table-column prop="rfid" label="射频识别">
						</el-table-column>
						<el-table-column prop="jdRfid" label="京东Rfid">
						</el-table-column>createTime
						<el-table-column prop="updateTime" label="更新时间">
						</el-table-column>
						<el-table-column prop="createTime" label="创建时间">
						</el-table-column>
						<el-table-column prop="state" label="状态" width="300">
						</el-table-column>
					</el-table>
				</div>
				<div class="pagination-main">
					<!-- <el-pagination background layout="prev, pager, next" :total="total" :page-size="listPostData.pageSize"
						:current-page.sync="listPostData.pageNum" @current-change="handleCurrentChange">
					</el-pagination> -->

					<el-pagination @size-change="handleSizeChange" @current-change="handleCurrentChange"
						:page-sizes="[10, 20, 50, 100]" :page-size="listPostData.pageSize" :current-page="listPostData.pageNum"
						layout="total, sizes, prev, pager, next, jumper" :total="total">
					</el-pagination>
				</div>
			</div>

		</div>
	</div>
</body>

<script>
	const app = {
		data() {
			return {
				apiBaseUrl: 'http://8.137.162.161:8080/',
				streamUrl: 'http://8.137.162.161:8080/api/rfid/realtime/stream',
				listPostData: {
					pageNum: 1,
					pageSize: 20,
					startDateTime: "",
					endDateTime: "",
					trayId: "" //托盘ID
				},
				tableData: [],
				value1: '',
				total: 100,
				currentPage: 1,
				trayIdList: [
				],
				eventSource: null,
				refreshTimer: null,
				streamStatus: 'disconnected',
				streamStatusText: '长连接未连接',
				pickerOptions: {
					shortcuts: [{
						text: '最近一周',
						onClick(picker) {
							const end = new Date();
							const start = new Date();
							start.setTime(start.getTime() - 3600 * 1000 * 24 * 7);
							picker.$emit('pick', [start, end]);
						}
					}, {
						text: '最近一个月',
						onClick(picker) {
							const end = new Date();
							const start = new Date();
							start.setTime(start.getTime() - 3600 * 1000 * 24 * 30);
							picker.$emit('pick', [start, end]);
						}
					}, {
						text: '最近三个月',
						onClick(picker) {
							const end = new Date();
							const start = new Date();
							start.setTime(start.getTime() - 3600 * 1000 * 24 * 90);
							picker.$emit('pick', [start, end]);
						}
					}]
				},

			}
		},
		mounted() {
			this.search();
			this.getTrayList();
			this.connectStream();
		},
		methods: {
			// 获取托盘ID列表
			getTrayList() {
				fetch(this.apiBaseUrl + 'api/rfid/trays', {
					method: 'GET',
					headers: {
						'Content-Type': 'application/json'
					},
				}).then(res => {
					if (!res.ok) {
						throw new Error(`HTTP error! status: ${res.status}`);
					}
					return res.json();
				}).then(res => {
					console.log(res)
					this.trayIdList = res.data;
				}).catch(error => {
					console.error('获取托盘ID列表失败:', error);
					this.trayIdList = [];
				});
			},
			// 查询数据
			search() {
				fetch(this.apiBaseUrl + 'api/rfid/page', {
					method: 'POST',
					headers: {
						'Content-Type': 'application/json'
					},
					body: JSON.stringify(this.listPostData)
				}).then(res => {
					if (!res.ok) {
						throw new Error(`HTTP error! status: ${res.status}`);
					}
					return res.json();
				}).then(res => {

					// 先拿到原始列表
					const records = res.data.records;

					// 正确格式化时间 + 结构平铺（去掉多余的 item 包裹）
					const newtableData = res.data.records.map(item => {
						return {
							...item, // 保留原对象所有字段
							updateTime: item.updateTime.replace('T', ' '),
							createTime: item.createTime.replace('T', ' ')
						};
					});
					// 赋值给表格数据源
					this.tableData = newtableData;
					this.total = res.data.total;
				})

			},
			handleCurrentChange(val) {
				this.listPostData.pageNum = val;
				this.search();
			},
			handleSizeChange(val) {
				this.listPostData.pageSize = val;
				this.listPostData.pageNum = 1;
				this.search();
			},
			handleSearch(val) {
				// 处理清除事件
				if (!val) {
					this.listPostData.startDateTime = "";
					this.listPostData.endDateTime = "";
					console.log('日期已清除');
					return;
				}
				//将这个时间转化为2026-04-23T00:00:00格式
				// 解决时区问题，获取本地日期
				const startDate = new Date(val[0]);
				const endDate = new Date(val[1]);

				// 格式化为YYYY-MM-DD
				const startDateStr = startDate.getFullYear() + '-' +
					String(startDate.getMonth() + 1).padStart(2, '0') + '-' +
					String(startDate.getDate()).padStart(2, '0');

				const endDateStr = endDate.getFullYear() + '-' +
					String(endDate.getMonth() + 1).padStart(2, '0') + '-' +
					String(endDate.getDate()).padStart(2, '0');

				this.listPostData.startDateTime = startDateStr + 'T00:00:00';
				this.listPostData.endDateTime = endDateStr + 'T23:59:59';
				console.log('val', this.listPostData.startDateTime, this.listPostData.endDateTime);

			},
			// 点击查询按钮
			searchClick() {
				this.listPostData.pageNum = "1";
				this.search();
			},


			// 连接长连接
			connectStream() {
				if (!window.EventSource) {
					this.streamStatus = 'unsupported';
					this.streamStatusText = '浏览器不支持长连接';
					console.error('浏览器不支持 EventSource');
					return;
				}

				if (this.eventSource) {
					console.log('关闭现有连接');
					this.eventSource.close();
					this.eventSource = null;
				}

				console.log('尝试建立长连接:', this.streamUrl);

				try {
					this.eventSource = new EventSource(this.streamUrl);

					this.eventSource.addEventListener('connect', (event) => {
						console.log('收到 connect 事件:', event);
						this.streamStatus = 'connected';
						this.streamStatusText = '长连接已连接';
					});

					this.eventSource.addEventListener('rfid-change', (event) => {
						console.log('收到 rfid-change 事件:', event);
						this.scheduleRealtimeReload(event);
					});

					this.eventSource.onopen = () => {
						console.log('EventSource 连接已打开');
					};

					this.eventSource.onerror = (error) => {
						console.error('EventSource 错误:', error);
						console.log('EventSource readyState:', this.eventSource ? this.eventSource.readyState : 'null');

						this.streamStatus = 'error';
						this.streamStatusText = '长连接断开，重连中...';

						if (this.eventSource) {
							this.eventSource.close();
							this.eventSource = null;
						}

						console.log('3秒后尝试重新连接...');
						setTimeout(() => {
							this.connectStream();
						}, 3000);
					};
				} catch (error) {
					console.error('创建 EventSource 失败:', error);
					this.streamStatus = 'error';
					this.streamStatusText = '长连接创建失败';

					setTimeout(() => {
						this.connectStream();
					}, 3000);
				}
			},
			scheduleRealtimeReload(event) {
				try {
					const data = JSON.parse(event.data || '{}');
					console.log('收到实时更新:', data);
				} catch (e) {
					console.error('解析实时数据失败:', e);
				}

				if (this.refreshTimer) {
					clearTimeout(this.refreshTimer);
				}

				this.refreshTimer = setTimeout(() => {
					console.log('自动刷新数据');
					this.search();
				}, 300);
			},
		},

	}
	new Vue({
		el: '#app',
		data: app.data(),
		methods: app.methods,
		mounted: app.mounted
	})
</script>
