<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>京东信息表-成都青鸟维安科技有限公司</title>
	<script src="js/vue.js"></script>
	<link rel="stylesheet" href="css/elementui.css">
	<link rel="stylesheet" href="css/index.css">
	<!-- 引入组件库 -->
	<script src="js/elementui.js"></script>
</head>

<body>
	<div id="app">
		<div class="content">
			<div>
				<div class="caption">
					京东RFID扫码实时看板
					<!-- 选择仓库 -->
					<div class="warehouse-container">
						<span class="icon el-icon-s-home"></span>
						<span class="warehouse">
							<el-select v-model="listPostData.storehouseId" placeholder="选择仓库" size="mini" @change="changeWarehouse">
								<el-option v-for="(item, index) in allWarehouse" :key="item.id || index" :label="item.companyName"
									:value="item.id">
								</el-option>
							</el-select>
						</span>
					</div>
					<div class="stream-status">
						<span :class="['stream-dot', { online: streamStatus === 'connected' }]"></span>
						<span>{{ streamStatusText }}</span>
					</div>
				</div>

				<div class="search-container">
					<div>
						<div class="block">
							<span class="demonstration">按日期搜索</span>
							<el-date-picker v-model="value1" type="daterange" align="right" unlink-panels range-separator="至"
								start-placeholder="开始日期" end-placeholder="结束日期" :picker-options="pickerOptions" @change="handleSearch"
								clearable size="small">
							</el-date-picker>
						</div>
						<div class="block">
							<span class="demonstration">托盘ID</span>
							<el-select v-model="listPostData.trayId" placeholder="请选择托盘" clearable size="small">
								<el-option v-for="(item, index) in trayIdList" :key="item.id || index" :label="item.label || item"
									:value="item.id || item"></el-option>
							</el-select>
						</div>
						<div class="block">
							<span class="demonstration">状态</span>
							<el-select v-model="listPostData.state" placeholder="请选择状态" clearable size="small">
								<el-option v-for="(item, index) in exceptionList" :key="item.id || index" :label="item || item"
									:value="item || item"></el-option>
							</el-select>
						</div>
						<el-button type="primary" @click="searchClick" size="small">查询</el-button>
					</div>
					<div>
						<div class="block">
							<el-button type="success" size="mini" @click="outTrayDialogVisible = true">选择出库托盘</el-button>
						</div>
					</div>
				</div>
				<div class="table-container">
					<el-table :data="tableData" height="250" border style="width: 100%">
						<el-table-column prop="id" label="ID" width="100">
						</el-table-column>
						<el-table-column prop="trayId" label="托盘ID" width="180">
						</el-table-column>
						<el-table-column prop="epc" label="EPC" width="380">
						</el-table-column>
						<el-table-column prop="rfid" label="射频识别">
						</el-table-column>
						<el-table-column prop="jdRfid" label="京东Rfid">
						</el-table-column>
						<el-table-column prop="updateTime" label="更新时间">
						</el-table-column>
						<el-table-column prop="createTime" label="创建时间">
						</el-table-column>
						<el-table-column prop="state" label="状态" width="300">
						</el-table-column>
					</el-table>
				</div>
				<div class="pagination-main">
					<el-pagination @size-change="handleSizeChange" @current-change="handleCurrentChange"
						:page-sizes="[30, 50, 100]" :page-size="listPostData.pageSize" :current-page="listPostData.pageNum"
						layout="total, sizes, prev, pager, next, jumper" :total="total">
					</el-pagination>
				</div>
			</div>
			<el-dialog class="outTrayDialog" title="选择出库托盘" :visible.sync="outTrayDialogVisible" width="625px"
				:close-on-click-modal="false">
				<div class="">
					<el-transfer filterable :filter-method="filterMethod" filter-placeholder="请输入托盘ID" v-model="outListPostData"
						:data="trayIdList2" :titles="['不可出库托盘', '可出库托盘']" @change="handleChangeTransfer">
					</el-transfer>
				</div>
				<span slot="footer" class="dialog-footer">
					<el-button @click="outLoading = false; outTrayDialogVisible = false" size="small">取消</el-button>
					<el-button type="primary" @click="confirmOutbound" :loading="outLoading" size="small">确认出库清单</el-button>
				</span>
			</el-dialog>
			<el-dialog class="errorDialog" :visible.sync="dialogVisible" width="40%" :close-on-click-modal="false">
				<div class="dialogTitle">异常警告<span> （ 当前托盘：{{exceptionMessage.length > 0 ? exceptionMessage[0].trayId : '' }}
						）</span>
				</div>
				<div class="dialogCont">
					<div>
						<div class="exceptionItem" v-for="(item, index) in exceptionMessage" :key="item.trayId">
							<div class="left">
								<span> 货号：{{ item.id }} - {{item.state}}：</span>
							</div>
							<div class="right">
								<div class="exceptionCont">
									<p>异常类型：{{ item.businessState }}</p>
									<p>京东rfid：{{ item.rfid }}</p>
									<p>异常时间：{{ item.createTime }}</p>
									<p>京东Rfid：{{ item.jdRfid }}</p>
								</div>
							</div>
						</div>
					</div>
				</div>
			</el-dialog>
		</div>
	</div>
</body>

<script>
	const app = {
		data() {
			return {
				allWarehouse: [],
				//本地：http://192.168.0.209:8080/     线上： http://8.137.162.161:8080/
				apiBaseUrl: 'http://8.137.162.161:8080/',
				listPostData: {
					pageNum: 1,
					pageSize: 30,
					startDateTime: "",
					endDateTime: "",
					trayId: "",
					storehouseId: ""//仓库ID
				},
				tableData: [],
				value1: '',
				total: 100,
				eventSource: null,
				refreshTimer: null,//防抖定时器
				streamStatus: 'disconnected',
				streamStatusText: '长连接未连接',
				pickerOptions: {
					shortcuts: [
						{ text: '最近一周', days: 7 },
						{ text: '最近一个月', days: 30 },
						{ text: '最近三个月', days: 90 }
					].map(({ text, days }) => ({
						text,
						onClick(picker) {
							const end = new Date();
							const start = new Date();
							start.setTime(start.getTime() - 3600 * 1000 * 24 * days);
							picker.$emit('pick', [start, end]);
						}
					}))
				},
				dialogVisible: false,
				outTrayDialogVisible: false,
				exceptionList: ['异常（缺货）', '异常（错误堆放）'],//异常情况清单
				exceptionMessage: [],//异常数据列表
				trayIdList: [],//托盘ID列表
				trayIdList2: [],//出库托盘ID列表
				outListPostData: [],//已保存中的出库托盘ID数组
				defaultOutTray: [],//初始化保存值
				outListPostlist: [],//预备出库托盘库
				outLoading: false,//出库加载状态
				filterMethod(query, item) {
					return item.label.indexOf(query) > -1;
				}
			}
		},
		mounted() {
			this.searchWarehouse();
			this.connectStream();
		},
		methods: {
			// ===== 基础请求封装 =====
			request(url, options = {}) {
				return fetch(this.apiBaseUrl + url, options)
					.then(res => {
						if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
						return res.json();
					});
			},
			post(url, data) {
				return this.request(url, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(data)
				});
			},
			get(url, data) {
				let fullUrl = url;
				if (data && Object.keys(data).length > 0) {
					const params = new URLSearchParams(data);
					fullUrl += '?' + params.toString();
				}
				return this.request(fullUrl, { method: 'GET' });
			},

			// ===== 工具函数 =====
			formatDate(date) {
				const d = new Date(date);
				return d.getFullYear() + '-' +
					String(d.getMonth() + 1).padStart(2, '0') + '-' +
					String(d.getDate()).padStart(2, '0');
			},
			formatTime(timeStr) {
				return timeStr ? timeStr.replace('T', ' ') : timeStr;
			},
			isSameCollection(arr1, arr2) {
				if (arr1.length !== arr2.length) return false;
				const set2 = new Set(arr2);
				return arr1.every(item => set2.has(item));
			},
			setStreamStatus(status, text) {
				this.streamStatus = status;
				this.streamStatusText = text;
			},

			// ===== 页面初始化与数据加载 =====
			searchWarehouse() {
				this.request('api/companies/enabled', {
					method: 'GET',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
				}).then(res => {
					if (res.data) {
						this.allWarehouse = res.data;
						this.listPostData.storehouseId = res.data[0].id;
						this.changeWarehouse();
					}
				}).catch(error => {
					console.error('查询默认仓库失败:', error);
				});
			},
			//
			changeWarehouse(val) {
				if (val) {
					this.listPostData.trayId = "";
					this.listPostData.endDateTime = "";
					this.listPostData.startDateTime = "";
					this.listPostData.state = "";
					this.listPostData.pageNum = 1;
					this.listPostData.pageSize = 30;
					this.listPostData.storehouseId = val;
					this.value1 = '';
				}
				this.post('api/rfid/page', this.listPostData).then(res => {
					this.tableData = res.data.records.map(item => ({
						...item,
						updateTime: this.formatTime(item.updateTime),
						createTime: this.formatTime(item.createTime)
					}));
					this.total = res.data.total;
					this.defaultSearch();
				});
			},
			defaultSearch() {
				const storehouseId = this.listPostData.storehouseId;
				this.post('api/rfid/page', { pageNum: 1, pageSize: 10000, storehouseId }).then(res => {
					this.trayIdList = [...new Set(res.data.records.map(item => item.trayId))];
					this.trayIdList2 = this.trayIdList.map(item => ({ key: item, label: item }));
					this.OutTraySearch().then(savedOutTrayIds => {
						this.outListPostData = savedOutTrayIds || [];
						this.defaultOutTray = [...this.outListPostData];
					});
				});
			},

			// ===== 搜索与筛选 =====
			handleSearch(val) {
				if (!val) {
					this.listPostData.startDateTime = "";
					this.listPostData.endDateTime = "";
					return;
				}
				this.listPostData.startDateTime = this.formatDate(val[0]) + 'T00:00:00';
				this.listPostData.endDateTime = this.formatDate(val[1]) + 'T23:59:59';
			},
			searchClick() {
				this.listPostData.pageNum = 1;
				this.changeWarehouse();
			},

			// ===== 分页 =====
			handleCurrentChange(val) {
				this.listPostData.pageNum = val;
				this.changeWarehouse();
			},
			handleSizeChange(val) {
				this.listPostData.pageSize = val;
				this.listPostData.pageNum = 1;
				this.changeWarehouse();
			},

			OutTraySearch() {
				return this.request(`api/companies/${this.listPostData.storehouseId}/outbound-tray-authorizations`, {
					method: 'GET',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
				}).then(res => {
					if (res.data.length > 0) {
						return res.data[0].trayIds;
					}
				});
			},

			handleChangeTransfer(val) {
				this.outListPostlist = val;
			},

			// 出库授权
			OutTrayAuthorization(data) {
				console.log(this.outListPostData, '出库授权数据')
				console.log(this.defaultOutTray, '默认出库数据数据')

				if (this.isSameCollection(this.outListPostData, this.defaultOutTray)) {
					this.$message({
						message: '你没有改变任何出库的托盘',
						type: 'warning'
					});
					return;
				}
				this.request(`api/companies/${this.listPostData.storehouseId}/outbound-tray-authorizations`, {
					method: 'PUT',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(data)
				}).then(res => {
					this.outTrayDialogVisible = false;
					this.defaultOutTray = [...this.outListPostData];//更新默认出库数据
					if (res.data) {
						this.$message({
							message: '出库授权成功',
							type: 'success'
						});
					}
				});
			},

			// 确认出库
			confirmOutbound() {
				this.OutTrayAuthorization({ trayIds: this.outListPostlist });
			},


			// ===== 异常处理 =====
			exceptionSearch(id) {
				if (id) {
					this.exceptionMessage = [];
					this.get(`api/rfid/${id}`).then(res => {
						if (res.data.state.includes('异常')) {
							this.dialogVisible = true;
							this.exceptionMessage = [res.data];
						}
					});
				}
			},

			// ===== SSE长连接 =====
			connectStream() {
				if (!window.EventSource) {
					this.setStreamStatus('unsupported', '浏览器不支持长连接');
					return;
				}
				this.closeStream();
				this.eventSource = new EventSource(this.apiBaseUrl + 'api/rfid/realtime/stream');
				this.eventSource.onopen = () => {
					this.setStreamStatus('connected', '长连接已连接');
				};
				this.eventSource.addEventListener('rfid-change', (event) => {
					this.scheduleRealtimeReload(event);
				});
				this.eventSource.onerror = () => {
					this.setStreamStatus('error', '长连接断开，重连中...');
					this.closeStream();
					setTimeout(() => this.connectStream(), 3000);
				};
			},
			closeStream() {
				if (this.eventSource) {
					this.eventSource.close();
					this.eventSource = null;
				}
			},
			scheduleRealtimeReload(event) {
				try {
					const data = JSON.parse(event.data);
					this.exceptionSearch(data.recordId);
				} catch (e) {
					console.error('解析实时数据失败:', e);
				}
				// 防抖处理
				if (this.refreshTimer) clearTimeout(this.refreshTimer);
				this.refreshTimer = setTimeout(() => this.changeWarehouse(), 500);
			},
		},
	}
	new Vue({
		el: '#app',
		...app
	})
</script>

</html>
