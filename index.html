<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>京东信息表-成都青鸟维安科技有限公司</title>
	<script src="js/vue.js"></script>
	<link rel="stylesheet" href="css/index.css">
	<!-- 引入组件库 -->
	<script src="js/elementui.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.content {
			width: 100%;
			height: 100vh;
		}

		.content>div {
			display: flex;
			height: 100%;
			flex-direction: column;
			gap: 10px;
			/* background: #f1f1f1; */
		}

		thead * {
			text-align: center !important;
		}

		.caption {
			flex: none;
			font-size: 24px;
			font-weight: bold;
			text-align: center;
			color: #fff;
			padding: 15px 10px 5px;
			background: linear-gradient(135deg, #0f3d75, #2563eb);
			position: relative;

			.warehouse-container {
				position: absolute;
				right: 20px;
				top: 20px;


				.icon {
					transform: translateY(2px);
					font-size: 20px;
					margin-left: 20px;
				}

				.warehouse {
					width: 120px;
					display: inline-block;

					.el-input__inner {
						background-color: inherit;
						border: 0px;
						color: #fff;
						height: 30px;
						line-height: 30px;
						outline: 0;
						padding: 0 15px;
						padding-left: 0px;
					}
				}
			}
		}

		.table-container {
			flex: 1;
			height: 1px;
			text-align: center;
		}

		.search-container {
			background: #ffffff;
			flex: none;
			display: flex;
			gap: 20px;
			align-items: center;
			padding: 10px;
			border-radius: 5px;
			justify-content: space-between;

			>div {
				flex: none;
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.block {
				display: flex;
				gap: 10px;
				align-items: center;

				.demonstration {
					width: 100px;
					text-align: right;
					font-size: 14px;
				}

				.el-date-editor .el-range-separator {
					width: 10%;
				}

			}
		}

		.pagination-main {
			width: 100%;
			flex: none;
			margin: auto;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 5px;
			background: #fff;
		}

		.el-table {
			height: 100% !important;
		}

		.el-table .cell {
			text-align: center;
		}

		.el-table .el-table__cell {
			padding: 11.05px 0;
		}

		.el-pagination {
			.el-pager li {
				padding: 0px;

				&.active {
					background: #409EFF;
					color: #ffffff;
				}
			}


		}

		.stream-status {
			/* flex: none;
			display: flex;
			align-items: center; */
			gap: 8px;
			font-size: 14px;
			color: #fff;
			padding: 5px 10px;
			border-radius: 4px;
			text-align: center;
		}

		.stream-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: #ff4d4f;
			animation: blink 1s infinite;
		}

		.stream-dot.online {
			background: #52c41a;
			animation: none;
		}

		@keyframes blink {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0.3;
			}
		}

		.outTrayDialog {
			.el-dialog__header {
				padding: 10px 20px 10px;
				background: #243c65;


				.el-dialog__title {
					color: #fff;
				}
			}


		}

		.errorDialog {



			.el-dialog {
				display: flex;
				flex-direction: column;

				border-radius: 5px;
				border: 1px solid #fd9a9c;
				box-shadow: 0 3px 30px 0 #ff0004;
				animation: alarmBlink 1s ease-in-out infinite;


				.el-dialog__header {
					padding: 0;
				}

				.el-dialog__title {
					color: #ff0004;
				}

				.el-dialog__body {
					display: flex;
					flex: 1;
					height: 100%;
					flex-direction: column;
					gap: 25px;
					padding: 25px;
					overflow: hidden;

					.dialogTitle {
						font-size: 18px;
						flex: none;
						font-weight: bold;
						text-align: left;
						color: #ff0004;

						span {
							font-size: 14px;
							color: #fff;
							color: #ff0004;
						}
					}

					.dialogCont {
						font-size: 16px;
						overflow-y: scroll;
						scrollbar-width: none;
						-ms-overflow-style: none;

						&::-webkit-scrollbar {
							display: none;
						}

						>div {

							.exceptionItem {
								margin-bottom: 10px;
								padding: 30px 40px;
								border-radius: 5px;
								font-size: 14px;
								display: flex;
								flex-direction: column;
								align-items: flex-start;
								gap: 10px;
								cursor: pointer;



								.left {
									flex: none;
									font-weight: bold;
									font-size: 16px;
									text-align: center;

									span {
										overflow: hidden;
									}

								}

								.right {
									flex: 1;
									width: 100%;
									display: flex;
									flex-direction: column;



									.exceptionCont {
										display: flex;
										flex-wrap: wrap;
										flex: 1;
										justify-content: space-between;

										p {
											width: 50%;
											margin-top: 30px;

											color: #999;

											&:nth-child(2n) {
												padding-left: 7%;
											}
										}
									}

									.mt20 {
										margin-top: 10px;
									}
								}

							}
						}
					}
				}
			}
		}

		@keyframes alarmBlink {
			0% {
				box-shadow: 0 3px 20px 0 rgba(240, 108, 111, 0.4);
				border-color: #fd9a9c;

			}

			50% {
				box-shadow: 0 3px 45px 12px rgb(250, 62, 65);
				border-color: #c24e50;

			}

			100% {
				box-shadow: 0 3px 20px 0 rgba(240, 108, 111, 0.4);
				border-color: #fd9a9c;

			}
		}
	</style>
</head>

<body>
	<div id="app">
		<div class="content">
			<div>
				<div class="caption">
					京东RFID扫码实时看板
					<!-- 选择仓库 -->
					<div class="warehouse-container">
						<span class="icon el-icon-s-home"></span>
						<span class="warehouse">
							<el-select v-model="listPostData.storehouseId" placeholder="选择仓库" size="mini" @change="changeWarehouse()">
								<el-option v-for="(item, index) in allWarehouse" :key="item.id || index" :label="item.companyName"
									:value="item.id">
								</el-option>
							</el-select>
						</span>
					</div>
					<div class="stream-status">
						<span :class="['stream-dot', { online: streamStatus === 'connected' }]"></span>
						<span>{{ streamStatusText }}</span>
					</div>
				</div>

				<div class="search-container">
					<div>
						<div class="block">
							<span class="demonstration">按日期搜索</span>
							<el-date-picker v-model="value1" type="daterange" align="right" unlink-panels range-separator="至"
								start-placeholder="开始日期" end-placeholder="结束日期" :picker-options="pickerOptions" @change="handleSearch"
								clearable size="small">
							</el-date-picker>
						</div>
						<div class="block">
							<span class="demonstration">托盘ID</span>
							<el-select v-model="listPostData.trayId" placeholder="请选择托盘" clearable size="small">
								<el-option v-for="(item, index) in trayIdList" :key="item.id || index" :label="item.label || item"
									:value="item.id || item"></el-option>
							</el-select>
						</div>
						<div class="block">
							<span class="demonstration">状态</span>
							<el-select v-model="listPostData.state" placeholder="请选择状态" clearable size="small">
								<el-option v-for="(item, index) in exceptionList" :key="item.id || index" :label="item || item"
									:value="item || item"></el-option>
							</el-select>
						</div>
						<el-button type="primary" @click="searchClick" size="small">查询</el-button>
					</div>
					<div>
						<div class="block">
							<el-button type="success" size="mini" @click="handleOutTrayClick">选择出库托盘</el-button>
						</div>
					</div>
				</div>
				<div class="table-container">
					<el-table :data="tableData" height="250" border style="width: 100%">
						<el-table-column prop="id" label="ID" width="100">
						</el-table-column>
						<el-table-column prop="trayId" label="托盘ID" width="180">
						</el-table-column>
						<el-table-column prop="epc" label="EPC" width="380">
						</el-table-column>
						<el-table-column prop="rfid" label="射频识别">
						</el-table-column>
						<el-table-column prop="jdRfid" label="京东Rfid">
						</el-table-column>
						<el-table-column prop="updateTime" label="更新时间">
						</el-table-column>
						<el-table-column prop="createTime" label="创建时间">
						</el-table-column>
						<el-table-column prop="state" label="状态" width="300">
						</el-table-column>
					</el-table>
				</div>
				<div class="pagination-main">
					<el-pagination @size-change="handleSizeChange" @current-change="handleCurrentChange"
						:page-sizes="[30, 50, 100]" :page-size="listPostData.pageSize" :current-page="listPostData.pageNum"
						layout="total, sizes, prev, pager, next, jumper" :total="total">
					</el-pagination>
				</div>
			</div>
			<el-dialog class="outTrayDialog" title="选择出库托盘" :visible.sync="outTrayDialogVisible" width="625px"
				:close-on-click-modal="false" :before-close="cancelOutbound">
				<div class="">
					<el-transfer filterable :filter-method="filterMethod" filter-placeholder="请输入托盘ID" v-model="outListPostData"
						:data="trayIdList2" :titles="['请勾选出库托盘', '已选托盘库']">
					</el-transfer>
				</div>
				<span slot="footer" class="dialog-footer">
					<el-button @click="cancelOutbound" size="small">取消</el-button>
					<el-button type="primary" @click="confirmOutbound" :loading="outLoading" size="small">确认出库</el-button>
				</span>
			</el-dialog>
			<el-dialog class="errorDialog" :visible.sync="dialogVisible" width="40%" :close-on-click-modal="false">
				<div class="dialogTitle">异常警告<span> （ 当前托盘：{{exceptionMessage.length > 0 ? exceptionMessage[0].trayId : '' }}
						）</span>
				</div>
				<div class="dialogCont">
					<div>
						<div class="exceptionItem" v-for="(item, index) in exceptionMessage" :key="item.trayId">
							<div class="left">
								<span> 货号：{{ item.id }} - {{item.state}}：</span>
							</div>
							<div class="right">
								<div class="exceptionCont">
									<p>异常类型：{{ item.businessState }}</p>
									<p>京东rfid：{{ item.rfid }}</p>
									<p>异常时间：{{ item.createTime }}</p>
									<p>京东Rfid：{{ item.jdRfid }}</p>
								</div>
							</div>
						</div>
					</div>
				</div>
			</el-dialog>
		</div>
	</div>
</body>

<script>
	const app = {
		data() {
			return {
				allWarehouse: [],
				apiBaseUrl: 'http://192.168.0.209:8080/', //http://8.137.162.161:8080/
				streamUrl: 'http://192.168.0.209:8080/api/rfid/realtime/stream',
				listPostData: {
					pageNum: 1,
					pageSize: 30,
					startDateTime: "",
					endDateTime: "",
					trayId: "",
					storehouseId: ""
				},
				tableData: [],
				value1: '',
				total: 100,
				eventSource: null,
				refreshTimer: null,//防抖定时器
				streamStatus: 'disconnected',
				streamStatusText: '长连接未连接',
				pickerOptions: {
					shortcuts: [
						{ text: '最近一周', days: 7 },
						{ text: '最近一个月', days: 30 },
						{ text: '最近三个月', days: 90 }
					].map(({ text, days }) => ({
						text,
						onClick(picker) {
							const end = new Date();
							const start = new Date();
							start.setTime(start.getTime() - 3600 * 1000 * 24 * days);
							picker.$emit('pick', [start, end]);
						}
					}))
				},
				dialogVisible: false,
				outTrayDialogVisible: false,
				exceptionList: ['异常（缺货）', '异常（错误堆放）'],//异常情况清单
				exceptionMessage: [],//异常数据列表
				defaultOutTray: [],//默认出库托盘
				defaultSearchList: [],//默认全部数据列表
				trayIdList: [],//托盘ID列表
				trayIdList2: [],//出库托盘ID列表
				outListPostData: [],//已选托盘库

				outLoading: false,
				filterMethod(query, item) {
					return item.label.indexOf(query) > -1;
				}

			}
		},
		mounted() {
			this.searchWarehouse();
			// this.getTrayList();
			this.connectStream();
		},
		methods: {
			// 默认仓库
			async searchWarehouse() {
				//查询默认仓库
				await this.request('api/companies/enabled', {
					method: 'GET',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
				}).then(res => {
					if (res.data) {
						this.allWarehouse = res.data;
						this.listPostData.storehouseId = res.data[0].id;
						this.changeWarehouse();
					}
				}).catch(error => {
					console.error('查询默认仓库失败:', error);
				});
			},
			//选择仓库
			changeWarehouse(val) {
				if (val) {
					this.listPostData.trayId = "";
					this.listPostData.endDateTime = "";
					this.listPostData.startDateTime = "";
					this.listPostData.pageNum = 1;
					this.listPostData.pageSize = 30;
					this.listPostData.storehouseId = val;
				}

				this.post('api/rfid/page', this.listPostData).then(res => {
					this.tableData = res.data.records.map(item => ({
						...item,
						updateTime: this.formatTime(item.updateTime),
						createTime: this.formatTime(item.createTime)
					}));
					this.total = res.data.total;
					this.defaultSearch();
				});
			},

			//默认全部数据
			defaultSearch(id) {
				this.defaultSearchList = [];
				const storehouseId = this.listPostData.storehouseId;
				// console.log(storehouseId, '当前仓库');
				this.post('api/rfid/page', {
					pageNum: 1,
					pageSize: 10000,
					storehouseId

				}).then(res => {
					this.defaultSearchList = res.data.records;
					const trayIdList = this.defaultSearchList.map(item => item.trayId);
					this.trayIdList = [...new Set(trayIdList)];
					this.trayIdList2 = this.trayIdList.map(item => {
						const trayId = typeof item === 'string' ? item : (item.trayId || item.id || item);
						return { key: trayId, label: trayId };
					});
					console.log(this.trayIdList2, '出库托盘ID列表');
				});
			},
			//查询默认已保存的出库的托盘ID
			moren() {
				this.request('api/rfid/operations/all', {
					method: 'GET',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
				}).then(res => {
					if (res.data && res.data.length > 0) {
						this.outListPostData = res.data.map(item => item.trayId);
						this.defaultOutTray = res.data.map(item => item.operationNo);
					}
				});
			},

			// 异常数据列表
			exceptionSearch(id) {
				if (id) {
					this.exceptionMessage = [];
					this.get(`api/rfid/${id}`).then(res => {
						if (res.data.state.includes('异常')) {
							this.dialogVisible = true;
							this.exceptionMessage = [res.data];
						}
					});
				}
			},

			// 处理出库托盘点击事件
			handleOutTrayClick() {
				this.outTrayDialogVisible = true;
			},
			// 封装基础请求方法
			request(url, options = {}) {
				return fetch(this.apiBaseUrl + url, options)
					.then(res => {
						if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
						return res.json();
					});
			},
			// 封装 JSON POST 请求
			post(url, data) {
				return this.request(url, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(data)
				});
			},
			// 封装 JSON GET 请求
			get(url, data) {
				let fullUrl = url;
				if (data && Object.keys(data).length > 0) {
					const params = new URLSearchParams(data);
					fullUrl += '?' + params.toString();
				}
				return this.request(fullUrl, {
					method: 'GET'
				});
			},
			// 格式化日期为 YYYY-MM-DD
			formatDate(date) {
				const d = new Date(date);
				return d.getFullYear() + '-' +
					String(d.getMonth() + 1).padStart(2, '0') + '-' +
					String(d.getDate()).padStart(2, '0');
			},
			// 格式化时间字符串（T替换为空格）
			formatTime(timeStr) {
				return timeStr ? timeStr.replace('T', ' ') : timeStr;
			},

			// 设置长连接状态
			setStreamStatus(status, text) {
				this.streamStatus = status;
				this.streamStatusText = text;
			},


			// 确认出库
			confirmOutbound() {
				if (this.outListPostData.length == 0) {
					this.$message.warning('已选托盘为空');
					return;
				}
				const data = {
					trayIds: this.outListPostData,
					operator: "测试"
				};
				this.outLoading = true;
				this.outTrayDialogVisible = false;
				this.post('api/rfid/operations/outbound/scan-trays', data).then(res => {
					console.log(res, '返回创建结果');
					if (res.code == 200) {
						this.$message.success(`创建出库成功,出库ID:${res.data.trayIds}`);
						this.outLoading = false;
					}
				}).catch(error => {
					console.error('出库请求失败:', error);
				});
			},
			// 取消出库
			cancelOutbound() {
				this.outLoading = false;
				this.outTrayDialogVisible = false;
			},




			// 分页切换	
			handleCurrentChange(val) {
				this.listPostData.pageNum = val;
				this.changeWarehouse();
			},
			// 分页大小切换	
			handleSizeChange(val) {
				this.listPostData.pageSize = val;
				this.listPostData.pageNum = 1;
				this.changeWarehouse();
			},
			// 时间范围查询	
			handleSearch(val) {
				if (!val) {
					this.listPostData.startDateTime = "";
					this.listPostData.endDateTime = "";
					return;
				}
				this.listPostData.startDateTime = this.formatDate(val[0]) + 'T00:00:00';
				this.listPostData.endDateTime = this.formatDate(val[1]) + 'T23:59:59';
			},
			// 查询	
			searchClick() {
				this.listPostData.pageNum = 1;
				this.changeWarehouse();
			},

			// 异常数据列表
			// searchException(id) {
			// 	console.log(id, '查询异常数据');
			// 	this.post(`api/rfid/${id}`).then(res => {
			// 		if (res.code == 200) {
			// 			console.log(res, '返回查询结果');
			// 			if (res.data.state.includes('异常')) {
			// 				this.dialogVisible = true;
			// 				this.exceptionMessage = res.data.message;
			// 			}
			// 		}
			// 	}).catch(error => {
			// 		console.error('出库请求失败:', error);
			// 	});
			// },

			// 关闭SSE连接
			closeStream() {
				if (this.eventSource) {
					this.eventSource.close();
					this.eventSource = null;
				}
			},
			// 连接长连接
			connectStream() {
				if (!window.EventSource) {
					this.setStreamStatus('unsupported', '浏览器不支持长连接');
					return;
				}
				// 关闭已存在的连接
				this.closeStream();
				// 创建 EventSource 实例
				this.eventSource = new EventSource(this.streamUrl);
				// 监听连接事件
				this.eventSource.onopen = () => {
					this.setStreamStatus('connected', '长连接已连接');
				};
				// 监听后端的rfid-change事件，触发实时更新事件
				this.eventSource.addEventListener('rfid-change', (event) => {
					this.scheduleRealtimeReload(event);

				});
				// 监听错误事件
				this.eventSource.onerror = () => {
					this.setStreamStatus('error', '长连接断开，重连中...');
					this.closeStream();
					setTimeout(() => this.connectStream(), 3000);
				};
			},
			// 处理实时更新事件（防抖）
			scheduleRealtimeReload(event) {
				try {
					const data = JSON.parse(event.data);
					console.log('收到实时更新:', data.recordId);
					this.exceptionSearch(data.recordId);
				} catch (e) {
					console.error('解析实时数据失败:', e);
				}
				// 防抖处理，避免频繁触发
				if (this.refreshTimer) clearTimeout(this.refreshTimer);
				this.refreshTimer = setTimeout(() => this.changeWarehouse(), 500);//500ms后刷新
			},
		},
	}
	new Vue({
		el: '#app',
		...app
	})
</script>

</html>
