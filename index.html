<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>京东信息表-成都青鸟维安科技有限公司</title>
	<script src="js/vue.js"></script>
	<link rel="stylesheet" href="css/index.css">
	<!-- 引入组件库 -->
	<script src="js/elementui.js"></script>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.content {
			width: 100%;
			height: 100vh;
		}

		.content>div {
			display: flex;
			height: 100%;
			flex-direction: column;
			gap: 10px;
			background: #f1f1f1;
		}

		thead * {
			text-align: center !important;
		}

		.caption {
			flex: none;
			font-size: 24px;
			font-weight: bold;
			text-align: center;
			color: #fff;
			padding: 15px 10px 5px;
			background: linear-gradient(135deg, #0f3d75, #2563eb);
		}

		.table-container {
			flex: 1;
			height: 1px;
			text-align: center;
		}

		.search-container {
			background: #ffffff;
			flex: none;
			display: flex;
			gap: 20px;
			align-items: center;
			padding: 10px;
			border-radius: 5px;
			justify-content: space-between;

			>div {
				flex: none;
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.block {
				display: flex;
				gap: 10px;
				align-items: center;

				.demonstration {
					width: 100px;
					text-align: right;
					font-size: 14px;
				}

				.el-date-editor .el-range-separator {
					width: 10%;
				}

			}
		}

		.pagination-main {
			width: 100%;
			flex: none;
			margin: auto;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 5px;
			background: #fff;
		}

		.el-table {
			height: 100% !important;
		}

		.el-table .cell {
			text-align: center;
		}

		.el-table .el-table__cell {
			padding: 11.05px 0;
		}

		.el-pagination {
			.el-pager li {
				padding: 0px;

				&.active {
					background: #409EFF;
					color: #ffffff;
				}
			}


		}

		.stream-status {
			/* flex: none;
			display: flex;
			align-items: center; */
			gap: 8px;
			font-size: 14px;
			color: #fff;
			padding: 5px 10px;
			border-radius: 4px;
			text-align: center;
		}

		.stream-dot {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: #ff4d4f;
			animation: blink 1s infinite;
		}

		.stream-dot.online {
			background: #52c41a;
			animation: none;
		}

		@keyframes blink {

			0%,
			100% {
				opacity: 1;
			}

			50% {
				opacity: 0.3;
			}
		}

		.outTrayDialog {
			.el-dialog__header {
				padding: 10px 20px 10px;
				background: #243c65;


				.el-dialog__title {
					color: #fff;
				}
			}

			/* .el-checkbox__label {
				color: #00f87c;
			} */
		}

		.errorDialog {
			.el-dialog {
				box-shadow: 0 3px 15px 0 #f06c6f;

				.el-dialog__title {
					color: #fa4649;
				}

				.el-dialog__body {
					padding: 10px 25px 25px 25px;

					.dialogCont {
						font-size: 16px;

						.mt20 {
							margin-top: 20px;
						}
					}
				}
			}
		}
	</style>
</head>

<body>
	<div id="app">
		<div class="content">
			<div>
				<div class="caption">京东RFID扫码实时看板
					<div class="stream-status">
						<span :class="['stream-dot', { online: streamStatus === 'connected' }]"></span>
						<span>{{ streamStatusText }}</span>
					</div>
				</div>

				<div class="search-container">
					<div>
						<div class="block">
							<span class="demonstration">按日期搜索</span>
							<el-date-picker v-model="value1" type="daterange" align="right" unlink-panels range-separator="至"
								start-placeholder="开始日期" end-placeholder="结束日期" :picker-options="pickerOptions" @change="handleSearch"
								clearable size="small">
							</el-date-picker>
						</div>
						<div class="block">
							<span class="demonstration">托盘ID</span>
							<el-select v-model="listPostData.trayId" placeholder="请选择托盘" clearable size="small">
								<el-option v-for="(item, index) in trayIdList" :key="item.id || index" :label="item.label || item"
									:value="item.id || item"></el-option>
							</el-select>
						</div>
						<el-button type="primary" @click="searchClick" size="small">查询</el-button>
					</div>
					<div>
						<div class="block">
							<el-button type="success" size="mini" @click="handleOutTrayClick">选择出库托盘</el-button>
							<el-switch ref="outTraySwitchT" v-model="outTray" active-value="1" inactive-value="0"
								active-color="#13ce66" inactive-color="#ff4949" @change="handleOutTrayChange">
							</el-switch>
						</div>

					</div>
				</div>


				<div class="table-container">
					<el-table :data="tableData" height="250" border style="width: 100%">

						<el-table-column prop="id" label="ID" width="100">
						</el-table-column>
						<el-table-column prop="trayId" label="托盘ID" width="180">
						</el-table-column>
						<el-table-column prop="epc" label="EPC" width="380">
						</el-table-column>
						<el-table-column prop="rfid" label="射频识别">
						</el-table-column>
						<el-table-column prop="jdRfid" label="京东Rfid">
						</el-table-column>
						<el-table-column prop="updateTime" label="更新时间">
						</el-table-column>
						<el-table-column prop="createTime" label="创建时间">
						</el-table-column>
						<el-table-column prop="state" label="状态" width="300">
						</el-table-column>
					</el-table>
				</div>
				<div class="pagination-main">
					<el-pagination @size-change="handleSizeChange" @current-change="handleCurrentChange"
						:page-sizes="[10, 20, 50, 100]" :page-size="listPostData.pageSize" :current-page="listPostData.pageNum"
						layout="total, sizes, prev, pager, next, jumper" :total="total">
					</el-pagination>
				</div>
			</div>
		</div>
		<el-dialog class="outTrayDialog" title="选择出库托盘" :visible.sync="outTrayDialogVisible" width="625px"
			:close-on-click-modal="false" :before-close="cancelOutbound">
			<div class="">
				<el-transfer filterable :filter-method="filterMethod" filter-placeholder="请输入托盘ID" v-model="outListPostData"
					:data="trayIdList2" :titles="['请勾选出库托盘', '已选托盘库']">
				</el-transfer>
			</div>
			<span slot="footer" class="dialog-footer">
				<el-button @click="cancelOutbound" size="small">取消</el-button>
				<el-button type="primary" @click="confirmOutbound" :loading="outLoading" size="small">确认出库</el-button>
			</span>
		</el-dialog>
		<el-dialog class="errorDialog" title="异常警告" :visible.sync="dialogVisible" width="30%" :close-on-click-modal="false">
			<div class="dialogCont">
				<div>
					<span>托盘ID: </span>
				</div>
				<div class="mt20">
					<span>不符合的货号: </span>
				</div>
			</div>
		</el-dialog>
	</div>
</body>

<script>
	const app = {
		data() {
			return {
				apiBaseUrl: 'http://192.168.0.209:8080/', //http://8.137.162.161:8080/
				streamUrl: 'http://192.168.0.209:8080/api/rfid/realtime/stream',
				listPostData: {
					pageNum: 1,
					pageSize: 20,
					startDateTime: "",
					endDateTime: "",
					trayId: ""
				},
				tableData: [],
				value1: '',
				total: 100,
				eventSource: null,
				refreshTimer: null,
				streamStatus: 'disconnected',
				streamStatusText: '长连接未连接',
				pickerOptions: {
					shortcuts: [
						{ text: '最近一周', days: 7 },
						{ text: '最近一个月', days: 30 },
						{ text: '最近三个月', days: 90 }
					].map(({ text, days }) => ({
						text,
						onClick(picker) {
							const end = new Date();
							const start = new Date();
							start.setTime(start.getTime() - 3600 * 1000 * 24 * days);
							picker.$emit('pick', [start, end]);
						}
					}))
				},
				dialogVisible: false,
				outTrayDialogVisible: false,
				outTray: '0',
				defaultOutTray: [],//默认出库托盘
				outListPostData: [],//出库托盘列表
				trayIdList: [],//托盘ID列表
				trayIdList2: [],
				outLoading: false,
				filterMethod(query, item) {
					return item.label.indexOf(query) > -1;
				}
			}
		},
		mounted() {
			this.search();
			this.getTrayList();
			this.connectStream();
			this.searchAllboundRecords();
		},
		methods: {
			// 处理出库托盘点击事件
			handleOutTrayClick() {
				if (this.outTray == '1') {
					this.$message.error('请先关闭已存在的出库托盘');
					return;
				}
				this.outTrayDialogVisible = true;
			},
			// 封装基础请求方法
			request(url, options = {}) {
				return fetch(this.apiBaseUrl + url, options)
					.then(res => {
						if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
						return res.json();
					});
			},
			// 封装 JSON POST 请求
			post(url, data) {
				return this.request(url, {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(data)
				});
			},
			// 封装 JSON GET 请求
			get(url, data) {
				let fullUrl = url;
				if (data && Object.keys(data).length > 0) {
					const params = new URLSearchParams(data);
					fullUrl += '?' + params.toString();
				}
				return this.request(fullUrl, {
					method: 'GET'
				});
			},
			// 格式化日期为 YYYY-MM-DD
			formatDate(date) {
				const d = new Date(date);
				return d.getFullYear() + '-' +
					String(d.getMonth() + 1).padStart(2, '0') + '-' +
					String(d.getDate()).padStart(2, '0');
			},
			// 格式化时间字符串（T替换为空格）
			formatTime(timeStr) {
				return timeStr ? timeStr.replace('T', ' ') : timeStr;
			},
			// 关闭SSE连接
			closeStream() {
				if (this.eventSource) {
					this.eventSource.close();
					this.eventSource = null;
				}
			},
			// 设置长连接状态
			setStreamStatus(status, text) {
				this.streamStatus = status;
				this.streamStatusText = text;
			},

			// 查询全部出库记录
			searchAllboundRecords() {
				this.request('api/rfid/operations/all', {
					method: 'GET',
					headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
				}).then(res => {
					if (res.data && res.data.length > 0) {
						this.outTray = '1';
						this.outListPostData = res.data.map(item => item.trayId);
						this.defaultOutTray = res.data.map(item => item.operationNo);
						// console.log(this.defaultOutTray, '默认出库托盘');
					}
				});
			},
			// 出库托盘切换
			handleOutTrayChange(val) {
				if (val == '0') {
					this.request(`api/rfid/operations/${this.defaultOutTray[0]}/physical`, {
						method: 'DELETE',
						headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
					}).then(res => {
						this.outTray = val;
						this.outLoading = false;
						this.outListPostData = [];
						this.defaultOutTray = [];
						this.$message.success('删除库托盘成功');
						console.log(res, '返回查询结果');
					});
				} else {
					this.outTray = 0;
					this.$refs.outTraySwitchT.disabled = false;
					this.$message.warning('请先选择出库托盘');
				}
			},
			// 确认出库
			confirmOutbound() {
				if (this.outListPostData.length == 0) {
					this.$message.warning('已选托盘为空');
					return;
				}
				if (this.outTray == '1') {
					this.$message.error('请先关闭已选择的出库托盘');
					return;
				}

				const postData = {
					trayIds: this.outListPostData,
					operator: "测试"
				};
				this.outLoading = true;
				this.outTray = '1';
				this.outTrayDialogVisible = false;

				this.post('api/rfid/operations/outbound/scan-trays', postData).then(res => {
					console.log(res, '返回创建结果');
					if (res.code == 200) {
						this.$message.success(`创建出库成功，出库ID：${res.data.trayIds}`);
						this.outLoading = false;
					}
				}).catch(error => {
					console.error('出库请求失败:', error);
				});
			},
			// 取消出库
			cancelOutbound() {
				this.outLoading = false;
				this.outTrayDialogVisible = false;
			},
			// 获取托盘ID列表
			getTrayList() {
				this.request('api/rfid/trays', {
					method: 'GET',
					headers: { 'Content-Type': 'application/json' }
				}).then(res => {
					if (res.data && Array.isArray(res.data)) {
						this.trayIdList = res.data;
						this.trayIdList2 = res.data.map(item => {
							const trayId = typeof item === 'string' ? item : (item.trayId || item.id || item);
							return { key: trayId, label: trayId };
						});
					}
				}).catch(error => {
					console.error('获取托盘ID列表失败:', error);
				});
			},
			// 默认数据列表
			search() {
				this.post('api/rfid/page', this.listPostData).then(res => {
					this.tableData = res.data.records.map(item => ({
						...item,
						updateTime: this.formatTime(item.updateTime),
						createTime: this.formatTime(item.createTime)
					}));
					this.total = res.data.total;
				});
			},
			// 分页切换	
			handleCurrentChange(val) {
				this.listPostData.pageNum = val;
				this.search();
			},
			// 分页大小切换	
			handleSizeChange(val) {
				this.listPostData.pageSize = val;
				this.listPostData.pageNum = 1;
				this.search();
			},
			// 时间范围查询	
			handleSearch(val) {
				if (!val) {
					this.listPostData.startDateTime = "";
					this.listPostData.endDateTime = "";
					return;
				}
				this.listPostData.startDateTime = this.formatDate(val[0]) + 'T00:00:00';
				this.listPostData.endDateTime = this.formatDate(val[1]) + 'T23:59:59';
			},
			// 查询	
			searchClick() {
				this.listPostData.pageNum = 1;
				this.search();
			},
			// 异常数据列表
			searchException() {
				console.log(this.defaultOutTray, '查询异常数据');

				return
				this.get('api/rfid/operations/{operationNo}/outbound/issues', this.listPostData).then(res => {
					this.tableData = res.data.records.map(item => ({
						...item,
						updateTime: this.formatTime(item.updateTime),
						createTime: this.formatTime(item.createTime)
					}));
					this.total = res.data.total;
				});
			},




			// 连接长连接
			connectStream() {
				if (!window.EventSource) {
					this.setStreamStatus('unsupported', '浏览器不支持长连接');
					console.error('浏览器不支持 EventSource');
					return;
				}
				this.closeStream();
				console.log('尝试建立长连接:', this.streamUrl);

				try {
					this.eventSource = new EventSource(this.streamUrl);

					this.eventSource.addEventListener('connect', () => {
						console.log('长连接已连接');
						this.setStreamStatus('connected', '长连接已连接');
					});
					// 监听 RFID 变化事件
					this.eventSource.addEventListener('rfid-change', (event) => {
						this.scheduleRealtimeReload(event);
						this.searchException();//查询异常数据
					});
					this.eventSource.onopen = () => {
						console.log('EventSource 连接已打开');
					};
					this.eventSource.onerror = () => {
						console.error('长连接断开，重连中...');
						this.setStreamStatus('error', '长连接断开，重连中...');
						this.closeStream();
						setTimeout(() => this.connectStream(), 3000);
					};
				} catch (error) {
					console.error('创建 EventSource 失败:', error);
					this.setStreamStatus('error', '长连接创建失败');
					setTimeout(() => this.connectStream(), 3000);
				}
			},
			// 处理实时更新事件（防抖）
			scheduleRealtimeReload(event) {
				try {
					const data = JSON.parse(event.data || '{}');
					console.log('收到实时更新:', data);
				} catch (e) {
					console.error('解析实时数据失败:', e);
				}
				if (this.refreshTimer) clearTimeout(this.refreshTimer);
				this.refreshTimer = setTimeout(() => this.search(), 300);
			},
		},
	}
	new Vue({
		el: '#app',
		...app
	})

</script>
